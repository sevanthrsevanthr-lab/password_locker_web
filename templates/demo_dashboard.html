<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1f;
            color: white;
            font-family: "Roboto", sans-serif;
            padding: 40px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #00eaff;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px #00eaff;
        }

        h2 {
            color: #00eaff;
            text-shadow: 0 0 15px #00eaff;
        }

        .btn-neon {
            margin-top: 20px;
            background: #00eaff;
            border: none;
            color: black;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 6px;
            box-shadow: 0 0 15px #00eaff;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Welcome, {{ username }} 👋</h2>
    <p class="mt-3">This is your demo dashboard for project presentation.</p>

    <a href="/demo-login" class="btn-neon">Logout</a>
</div>

</body>
</html>
