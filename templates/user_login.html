<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add Password - Login</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color:#f5f5f5; }
        .box {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }
        .title {
            font-size: 26px;
            font-weight: 600;
        }
        .subtitle {
            color: #6c757d;
        }
    </style>
</head>

<body>

<div class="box shadow">
    <h3 class="text-center title mb-1">🔐 Login</h3>
    <p class="text-center subtitle mb-4">Add Password for a Website</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label class="form-label">Website</label>
        <input name="website" class="form-control mb-3" placeholder="e.g. gmail.com" required>

        <label class="form-label">Username / Email</label>
        <input name="username" class="form-control mb-3" placeholder="e.g. youremail@gmail.com" required>

        <button class="btn btn-primary w-100 mt-2">Add Password</button>
    </form>

    <div class="text-center mt-3">
        <a href="/">View Password Table</a>
    </div>
</div>

</body>
</html>
