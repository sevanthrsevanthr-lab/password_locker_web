<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add Password - Cyber Vault</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #0a0f1f;
            color: white;
            font-family: "Roboto", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px #00eaff; }
            50% { box-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff; }
            100% { box-shadow: 0 0 10px #00eaff; }
        }

        .box {
            max-width: 450px;
            width: 100%;
            margin: auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            border: 2px solid #00eaff;
            animation: neonGlow 3s infinite ease-in-out;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            color: #00eaff;
            text-shadow: 0 0 16px #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #9bc4ce;
        }

        .input-glow {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00eaff;
            color: white;
        }

        .input-glow:focus {
            box-shadow: 0 0 15px #00eaff;
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            color: #000;
            font-weight: 600;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 15px #00eaff;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px #00eaff, 0 0 50px #00eaff;
        }
    </style>
</head>

<body>

<div class="box shadow">
    <h3 class="text-center title mb-1">🔑 Add New Password</h3>
    <p class="text-center subtitle mb-4">Store login details securely in your vault</p>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label class="form-label">Website</label>
        <input name="website"
               class="form-control mb-3 input-glow"
               placeholder="e.g. cybervault.com"
               required>

        <label class="form-label">Username / Email</label>
        <input name="username"
               class="form-control mb-3 input-glow"
               placeholder="e.g. user@cybervault.com"
               required>

        <button class="btn-neon mt-2">
            Save to Vault
        </button>

    </form>
</div>

</body>
</html>
