<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>User Login - Password Locker</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color:#f5f5f5; }
        .box {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box shadow">
    <h4 class="text-center mb-3">Add Account</h4>
    <p class="text-muted text-center">Enter website & username, password will be auto-generated</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label class="form-label">Website</label>
        <input name="website" class="form-control mb-3" required>

        <label class="form-label">Username / Email</label>
        <input name="username" class="form-control mb-3" required>

        <button class="btn btn-primary w-100">Continue</button>
    </form>

    <div class="text-center mt-3">
        <a href="/">View Password Table</a>
    </div>
</div>

</body>
</html>
