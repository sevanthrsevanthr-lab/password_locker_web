<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add Password - Cyber Vault</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>

        body {
            background: #0a0f1f;
            color: white;
            font-family: "Roboto", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 12px #00eaff; }
            50% { box-shadow: 0 0 25px #00eaff, 0 0 45px #00eaff; }
            100% { box-shadow: 0 0 12px #00eaff; }
        }

        .box {
            max-width: 480px;
            width: 100%;
            padding: 35px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 12px;
            border: 2px solid #00eaff;
            animation: neonGlow 3s infinite ease-in-out;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            color: #00eaff;
            text-shadow: 0 0 20px #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #9bc4ce;
            margin-bottom: 25px;
        }

        .input-glow {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00eaff;
            color: white;
        }

        .input-glow:focus {
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 15px #00eaff;
            color: white;
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            color: #000;
            font-weight: 600;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 0 20px #00eaff;
            margin-top: 10px;
        }

        .btn-neon:hover {
            box-shadow: 0 0 35px #00eaff, 0 0 60px #00eaff;
        }

    </style>
</head>

<body>

<div class="box shadow">

    <h3 class="title">🔑 Store New Credential</h3>
    <p class="subtitle">Add website login details securely — a strong password will be auto-generated.</p>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <!-- FORM -->
    <form method="POST" action="/add">

        <label class="form-label mt-2">Website</label>
        <input name="website"
               class="form-control mb-3 input-glow"
               placeholder="e.g. instagram.com"
               required>

        <label class="form-label">Username / Email</label>
        <input name="username"
               class="form-control mb-3 input-glow"
               placeholder="e.g. you@example.com"
               required>

        <button class="btn-neon">Generate & Store Password</button>

    </form>

</div>

</body>
</html>
