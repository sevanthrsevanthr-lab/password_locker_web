<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Generate Password - Login</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color:#f5f5f5; }
        .box {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }
        .title {
            font-size: 26px;
            font-weight: 600;
        }
        .subtitle {
            color: #6c757d;
        }
    </style>
</head>

<body>

<div class="box shadow">
    <h3 class="text-center title mb-1">🔐 Login</h3>
    <p class="text-center subtitle mb-4">Generate and Add a Secure Password</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label class="form-label">Website</label>
        <input name="website" class="form-control mb-3" placeholder="e.g. gmail.com" required>

        <label class="form-label">Username / Email</label>
        <input name="username" class="form-control mb-3" placeholder="e.g. youremail@gmail.com" required>

        <!-- Password Generator -->
        <label class="form-label">Generated Password</label>
        <div class="input-group mb-3">
            <input id="genPass" name="password" class="form-control" placeholder="Click Generate" readonly required>
            <button type="button" class="btn btn-outline-primary" id="genBtn">Generate</button>
            <button type="button" class="btn btn-outline-success" id="copyBtn">Copy</button>
        </div>

        <button class="btn btn-primary w-100 mt-2">Save Password</button>
    </form>
</div>

<!-- Password Generator Script -->
<script>
function generatePassword(length = 14) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-={}[]<>?";
    let pw = "";
    for (let i = 0; i < length; i++) {
        pw += chars[Math.floor(Math.random() * chars.length)];
    }
    return pw;
}

document.getElementById("genBtn").onclick = function () {
    document.getElementById("genPass").value = generatePassword();
};

document.getElementById("copyBtn").onclick = function () {
    const pw = document.getElementById("genPass").value;
    navigator.clipboard.writeText(pw);
    alert("Password copied!");
};
</script>

</body>
</html>
