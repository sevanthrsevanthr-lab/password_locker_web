<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Demo Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1f;
            color: white;
            font-family: "Roboto", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px #76B900; }
            50% { box-shadow: 0 0 20px #76B900, 0 0 40px #76B900; }
            100% { box-shadow: 0 0 10px #76B900; }
        }

        .box {
            background: rgba(0, 0, 0, 0.65);
            padding: 40px;
            width: 420px;
            border-radius: 12px;
            animation: neonGlow 3s infinite ease-in-out;
            border: 2px solid #76B900;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            color: #76B900;
            text-shadow: 0 0 15px #76B900;
        }

        .subtitle {
            text-align: center;
            color: #9bc4ce;
            margin-bottom: 20px;
        }

        .input-glow {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #76B900;
            color: white;
        }

        .input-glow:focus {
            box-shadow: 0 0 15px #76B900;
            border-color: #76B900;
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-neon {
            background: #76B900;
            border: none;
            color: #000;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 15px #76B900;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px #76B900, 0 0 50px #76B900;
        }
    </style>
</head>

<body>

<div class="box">

    <h3 class="title">🔐 Secure Demo Login</h3>
    <p class="subtitle">This is a dummy page for project presentation</p>

    {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="alert alert-success text-center">{{ success }}</div>

        <!-- ⭐ GO TO DASHBOARD BUTTON -->
        <a href="/demo-dashboard" class="btn btn-success w-100 mt-3">Go to Dashboard →</a>
    {% endif %}

    <form method="POST" action="/demo-login" class="mt-3">

        <label class="form-label mt-2">Username / Email</label>
        <input id="username" name="username" class="form-control input-glow mb-3"
               placeholder="Enter username" autocomplete="off" required>

        <label class="form-label">Password</label>
        <input id="password" name="password" type="password"
               class="form-control input-glow mb-4"
               placeholder="Enter password" required>

        <button type="submit" class="btn-neon">Login</button>
    </form>
</div>


<!-- ⭐ Auto-fill Password Script -->
<script>
document.getElementById("username").addEventListener("change", function () {
    const uname = this.value.trim();

    if (uname.length === 0) return;

    fetch(`/api/get-password/${encodeURIComponent(uname)}`)
        .then(response => response.json())
        .then(data => {
            if (data.password) {
                document.getElementById("password").value = data.password;
            }
        });
});
</script>

</body>
</html>
