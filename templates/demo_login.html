<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Demo Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1f;
            color: white;
            font-family: "Roboto", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Neon Glow Animation */
        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px #00eaff; }
            50% { box-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff; }
            100% { box-shadow: 0 0 10px #00eaff; }
        }

        /* Moving Cyber Grid Background */
        .cyber-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://i.imgur.com/ORYvTpr.png');
            opacity: 0.1;
            animation: moveGrid 20s linear infinite;
            pointer-events: none;
        }

        @keyframes moveGrid {
            from { transform: translateY(0); }
            to { transform: translateY(-100%); }
        }

        .box {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            width: 400px;
            border-radius: 12px;
            animation: neonGlow 3s infinite ease-in-out;
            border: 2px solid #00eaff;
            position: relative;
            z-index: 10;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 5px;
            color: #00eaff;
            text-shadow: 0 0 15px #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #9bc4ce;
            margin-bottom: 25px;
        }

        .input-glow {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00eaff;
            color: white;
        }
        .input-glow:focus {
            box-shadow: 0 0 15px #00eaff;
            border-color: #00eaff;
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            color: #000;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 15px #00eaff;
            transition: 0.3s;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px #00eaff, 0 0 50px #00eaff;
        }

        .lock-icon {
            font-size: 45px;
            text-align: center;
            margin-bottom: 15px;
            color: #00eaff;
            text-shadow: 0 0 20px #00eaff;
        }
    </style>
</head>

<body>

<div class="cyber-grid"></div>

<div class="box">
    <div class="lock-icon">🔐</div>
    <h3 class="title">Secure Demo Login</h3>
    <p class="subtitle">This is a dummy page for project presentation</p>

    <label class="form-label mt-2">Username / Email</label>
    <input class="form-control input-glow mb-3" placeholder="Enter username">

    <label class="form-label">Password</label>
    <input type="password" class="form-control input-glow mb-4" placeholder="Enter password">

    <button class="btn-neon">Login</button>
</div>

</body>
</html>
