<!DOCTYPE html>
<html>
<head>
    <title>Login - Password Locker</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color: #f2f2f2; }
        .box {
            max-width: 420px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box shadow">
    <h3 class="text-center mb-3">🔐 Master Login</h3>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input class="form-control mb-3" type="password" name="password"
               placeholder="Enter Master Password" required>
        <button class="btn btn-primary w-100">Login</button>
    </form>
</div>

</body>
</html>
