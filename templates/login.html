<!DOCTYPE html>
<html>
<head>
    <title>Password Locker</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color: #f2f2f2; }
        .box {
            max-width: 480px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
        h3 { text-align: center; }
    </style>
</head>

<body>

<!-- MASTER LOGIN (TOP SECTION) -->
<div class="box shadow mb-4">
    <h3>🔐 Master Login</h3>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input class="form-control mb-3" type="password" name="password"
               placeholder="Enter Master Password" required>
        <button class="btn btn-primary w-100">Login</button>
    </form>
</div>


<!-- USER LOGIN (ADD PASSWORD) — BELOW MASTER LOGIN -->
<div class="box shadow">

    <h3>🔑 Add Password</h3>

    {% if not session.user %}
        <p class="text-danger text-center mb-2">
            Login with Master Password above ⬆️
        </p>
    {% endif %}

    <form action="/add" method="POST">
        <input class="form-control mb-3" name="website" placeholder="Website" required>
        <input class="form-control mb-3" name="username" placeholder="Username / Email" required>
        <button class="btn btn-success w-100" {% if not session.user %}disabled{% endif %}>
            Add Password
        </button>
    </form>

</div>

</body>
</html>
