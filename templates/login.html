<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Cyber Vault - Login & Add Password</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>

        body {
            background: #0a0f1f;
            color: white;
            font-family: "Roboto", sans-serif;
            padding: 30px 0;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 12px #00eaff; }
            50% { box-shadow: 0 0 25px #00eaff, 0 0 50px #00eaff; }
            100% { box-shadow: 0 0 12px #00eaff; }
        }

        .neon-box {
            max-width: 450px;
            margin: 20px auto;
            padding: 30px;
            background: rgba(0,0,0,0.65);
            border: 2px solid #00eaff;
            border-radius: 12px;
            animation: neonGlow 3s infinite ease-in-out;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            color: #00eaff;
            text-shadow: 0 0 18px #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #9bc4ce;
            margin-bottom: 25px;
        }

        .input-glow {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00eaff;
            color: white;
        }

        .input-glow:focus {
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 20px #00eaff;
            color: white;
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            color: #000;
            border-radius: 6px;
            box-shadow: 0 0 18px #00eaff;
        }

        .btn-neon:hover {
            box-shadow: 0 0 35px #00eaff, 0 0 60px #00eaff;
        }

    </style>
</head>

<body>

<!-- 🔐 MASTER LOGIN BOX -->
<div class="neon-box">

    <h3 class="title">🔐 Master Login</h3>
    <p class="subtitle">Enter master password to unlock Add Password section</p>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input class="form-control input-glow mb-3"
               type="password"
               name="password"
               placeholder="Enter Master Password"
               required>

        <button class="btn-neon">Unlock Vault</button>
    </form>
</div>


<!-- 🔑 ADD PASSWORD BOX -->
<div class="neon-box">

    <h3 class="title">🔑 Add New Password</h3>
    <p class="subtitle">Store login details securely</p>

    {% if not session.user %}
    <p class="text-danger text-center">⚠️ Unlock vault first using Master Password above</p>
    {% endif %}

    <form method="POST" action="/add">

        <input class="form-control input-glow mb-3"
               name="website"
               placeholder="Website"
               required
               {% if not session.user %}disabled{% endif %}>

        <input class="form-control input-glow mb-3"
               name="username"
               placeholder="Username / Email"
               required
               {% if not session.user %}disabled{% endif %}>

        <button class="btn-neon"
                {% if not session.user %}disabled{% endif %}>
            Generate Password
        </button>

    </form>
</div>

</body>
</html>
