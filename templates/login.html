<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Master Login - Password Locker</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #0a0f1f;
            color: white;
            font-family: "Roboto", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px #00eaff; }
            50% { box-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff; }
            100% { box-shadow: 0 0 10px #00eaff; }
        }

        .box {
            max-width: 420px;
            width: 100%;
            margin: auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            border: 2px solid #00eaff;
            animation: neonGlow 3s infinite ease-in-out;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            color: #00eaff;
            text-shadow: 0 0 16px #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #9bc4ce;
        }

        .input-glow {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00eaff;
            color: white;
        }

        .input-glow:focus {
            box-shadow: 0 0 15px #00eaff;
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            color: #000;
            font-weight: 600;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 15px #00eaff;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px #00eaff, 0 0 50px #00eaff;
        }
    </style>
</head>

<body>

<div class="box shadow">
    <h3 class="title mb-2">🔐 Master Login</h3>
    <p class="subtitle mb-4">Enter your master password to unlock the vault</p>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input class="form-control mb-3 input-glow"
               type="password"
               name="password"
               placeholder="Enter Master Password"
               required>

        <button class="btn-neon mt-2">
            Unlock Vault
        </button>
    </form>
</div>

</body>
</html>
