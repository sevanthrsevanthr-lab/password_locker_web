<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Cyber Vault - Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1f;
            font-family: "Roboto", sans-serif;
            color: white;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px #00eaff; }
            50% { box-shadow: 0 0 25px #00eaff, 0 0 45px #00eaff; }
            100% { box-shadow: 0 0 10px #00eaff; }
        }

        .nav-neon {
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #00eaff;
            padding: 12px;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 600;
            color: #00eaff;
            text-shadow: 0 0 18px #00eaff;
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            color: black;
            font-weight: 600;
            box-shadow: 0 0 12px #00eaff;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px #00eaff, 0 0 45px #00eaff;
        }

        .table-neon {
            background: rgba(0,0,0,0.5);
            border: 2px solid #00eaff;
            color: white;
            animation: neonGlow 3s infinite ease-in-out;
        }

        thead {
            background: rgba(0,0,0,0.8);
            color: #00eaff;
            text-shadow: 0 0 10px #00eaff;
        }

        .action-btn {
            border-color: #00eaff !important;
            color: #00eaff !important;
            font-weight: 500;
        }

        .action-btn:hover {
            background: #00eaff !important;
            color: black !important;
            box-shadow: 0 0 18px #00eaff;
        }

        .masked {
            letter-spacing: 3px;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="nav-neon d-flex align-items-center justify-content-between px-3">
    <span class="nav-title">🔐 Cyber Vault</span>

    <a href="/logout" class="btn btn-sm btn-neon">
        Logout
    </a>
</nav>


<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between mb-3">
        <h3 style="color:#00eaff; text-shadow:0 0 15px #00eaff;">Saved Passwords</h3>

        <button class="btn btn-neon" data-bs-toggle="modal" data-bs-target="#addModal">
            + Add Password
        </button>
    </div>

    <!-- PASSWORD TABLE -->
    <div class="table-responsive">
        <table class="table table-neon table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Website</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Date Added</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for row in rows %}
                <tr>
                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>

                    <td>
                        <span id="p{{ row[0] }}" class="masked" data-real="{{ row[3] }}">
                            ********
                        </span>
                    </td>

                    <td>{{ row[4] }}</td>

                    <td>
                        <button class="btn btn-sm action-btn me-1 show-btn" data-id="{{ row[0] }}">
                            Show
                        </button>

                        <button class="btn btn-sm action-btn me-1 copy-btn" data-id="{{ row[0] }}">
                            Copy
                        </button>

                        <a class="btn btn-sm action-btn me-1" href="/edit/{{ row[0] }}">
                            Edit
                        </a>

                        <a class="btn btn-sm action-btn" href="/delete/{{ row[0] }}">
                            Delete
                        </a>
                    </td>
                </tr>

                {% endfor %}
            </tbody>
        </table>
    </div>
</div>


<!-- ADD PASSWORD MODAL -->
<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" action="/add" method="POST">

            <div class="modal-header">
                <h5 class="modal-title">Add New Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <label class="form-label">Website</label>
                <input class="form-control" name="website" required>

                <label class="form-label mt-3">Username / Email</label>
                <input class="form-control" name="username" required>

                <p class="text-info mt-2">A strong password will be auto-generated.</p>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-neon" type="submit">Add Password</button>
            </div>

        </form>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Show/Copy Password Script -->
<script>
    document.querySelectorAll('.show-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            let id = btn.getAttribute("data-id");
            let span = document.getElementById("p"+id);

            if (span.textContent === "********") {
                span.textContent = span.getAttribute("data-real");
            } else {
                span.textContent = "********";
            }
        });
    });

    document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            let id = btn.getAttribute("data-id");
            let text = document.getElementById("p"+id).getAttribute("data-real");
            navigator.clipboard.writeText(text);
            btn.textContent = "Copied!";
            setTimeout(() => btn.textContent = "Copy", 1500);
        });
    });
</script>

</body>
</html>
