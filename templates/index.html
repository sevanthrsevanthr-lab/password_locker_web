<!DOCTYPE html>
<html>
<head>
    <title>Password Locker</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        body { font-family: Arial; margin: 40px; }
        .btn { padding: 8px 14px; margin: 5px; cursor: pointer; }
        .show-btn { cursor: pointer; color: blue; }
    </style>

    <script>
        function togglePassword(id) {
            let pass = document.getElementById("p" + id);
            if (pass.innerText.includes("*")) {
                pass.innerText = pass.dataset.real;
            } else {
                pass.innerText = "********";
            }
        }
    </script>
</head>
<body>

<h2>Saved Passwords</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Website</th>
        <th>Username</th>
        <th>Password</th>
        <th>Date</th>
        <th>Delete</th>
    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>

        <td>
            <span id="p{{ row[0] }}" data-real="{{ row[3] }}">********</span>
            <span class="show-btn" onclick="togglePassword('{{ row[0] }}')">Show</span>
        </td>

        <td>{{ row[4] }}</td>
        <td><a href="/delete/{{ row[0] }}" onclick="return confirm('Delete this entry?')">Delete</a></td>
    </tr>
    {% endfor %}
</table>

<br><br>

<h2>Add New Password</h2>

<form action="/add" method="POST">
    <input type="text" name="website" placeholder="Website" required><br><br>
    <input type="text" name="username" placeholder="Username" required><br><br>
    <b>Password will be auto-generated</b><br><br>
    <button type="submit" class="btn">Add Password</button>
</form>

</body>
</html>
