<!DOCTYPE html>
<html>
<head>
    <title>Password Locker</title>
    <style>
        table, th, td { 
            border: 1px solid black; 
            border-collapse: collapse; 
            padding: 8px;
        }
        body { font-family: Arial; margin: 40px; }
        .btn { padding: 8px 14px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

<h2>Saved Passwords</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Website</th>
        <th>Username</th>
        <th>Password</th>
        <th>Date</th>
        <th>Delete</th>
    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
        <td><a href="/delete/{{ row[0] }}">Delete</a></td>
    </tr>
    {% endfor %}
</table>

<br><br>

<h2>Add New Password</h2>

<form action="/add" method="POST">
    <input type="text" name="website" placeholder="Website" required><br><br>
    <input type="text" name="username" placeholder="Username" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <button type="submit" class="btn">Add Password</button>
</form>

</body>
</html>
