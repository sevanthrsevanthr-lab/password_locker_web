<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Cyber Vault - Dashboard</title>

    <!-- ✅ ADD THIS LINE -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1f;
            font-family: "Roboto", sans-serif;
            color: white;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px #00eaff; }
            50% { box-shadow: 0 0 25px #00eaff, 0 0 45px #00eaff; }
            100% { box-shadow: 0 0 10px #00eaff; }
        }

        .nav-neon {
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #00eaff;
            padding: 12px;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 600;
            color: #00eaff;
            text-shadow: 0 0 18px #00eaff;
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            color: black;
            font-weight: 600;
            box-shadow: 0 0 12px #00eaff;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px #00eaff, 0 0 45px #00eaff;
        }

        .table-neon {
            background: rgba(0,0,0,0.5);
            border: 2px solid #00eaff;
            color: white;
            animation: neonGlow 3s infinite ease-in-out;
        }

        thead {
            background: rgba(0,0,0,0.8);
            color: #00eaff;
            text-shadow: 0 0 10px #00eaff;
        }

        .masked {
            letter-spacing: 3px;
        }
    </style>
</head>
