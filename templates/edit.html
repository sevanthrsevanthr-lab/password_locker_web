<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Entry - Cyber Vault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #050814;
            color: #e6f7ff;
            font-family: "Roboto", sans-serif;
        }

        .navbar-neon {
            background: rgba(0, 0, 0, 0.9) !important;
            border-bottom: 2px solid #00eaff;
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.4);
        }

        .navbar-brand {
            color: #00eaff !important;
            font-weight: 600;
            text-shadow: 0 0 12px #00eaff;
        }

        .container-neon {
            margin-top: 30px;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(0, 234, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.2);
            padding: 25px;
        }

        .input-glow {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00eaff;
            color: #e6f7ff;
        }

        .input-glow:focus {
            box-shadow: 0 0 15px #00eaff;
            background: rgba(255,255,255,0.15);
        }

        .btn-neon {
            background: #00eaff;
            border: none;
            color: #000;
            font-weight: 600;
            box-shadow: 0 0 15px #00eaff;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px #00eaff;
        }

        .btn-outline-light:hover {
            background:#e6f7ff;
            color:#050814;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-neon px-3">
    <a class="navbar-brand" href="/">🔐 Cyber Password Locker</a>
    <div class="ms-auto">
        <a class="btn btn-sm btn-outline-light" href="/">Back</a>
    </div>
</nav>

<div class="container d-flex justify-content-center">
    <div class="container-neon">
        <h4 class="mb-3">Edit Entry</h4>

        <form action="/update/{{ row[0] }}" method="POST" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Website</label>
                <input class="form-control input-glow" name="website" value="{{ row[1] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control input-glow" name="username" value="{{ row[2] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input id="editPassword" class="form-control input-glow" name="password" value="{{ password }}" required>
                    <button type="button" class="btn btn-outline-light" id="regenBtn">Regenerate</button>
                </div>
                <div class="form-text text-secondary">
                    You can type a new password, paste one, or regenerate a strong one.
                </div>
            </div>

            <button class="btn btn-neon" type="submit">Save Changes</button>
            <a class="btn btn-outline-light ms-2" href="/">Cancel</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function generateClientPassword(len=12){
        const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lower = "abcdefghijklmnopqrstuvwxyz";
        const digits = "0123456789";
        const symbols = "!@#$%^&*()-_=+{}[]|:;,.<>?/";
        let pw = [];
        pw.push(upper[Math.floor(Math.random()*upper.length)]);
        pw.push(lower[Math.floor(Math.random()*lower.length)]);
        pw.push(digits[Math.floor(Math.random()*digits.length)]);
        pw.push(symbols[Math.floor(Math.random()*symbols.length)]);
        const all = upper+lower+digits+symbols;
        for(let i=4;i<len;i++) pw.push(all[Math.floor(Math.random()*all.length)]);
        pw = pw.sort(()=>Math.random()-0.5).join("");
        return pw;
    }

    document.getElementById("regenBtn").addEventListener("click", function(){
        document.getElementById("editPassword").value = generateClientPassword(12);
    });
</script>
</body>
</html>
