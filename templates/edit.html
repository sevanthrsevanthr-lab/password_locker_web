<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Edit Entry - Password Locker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-light bg-light px-3">
    <a class="navbar-brand" href="/">🔐 Password Locker</a>
    <div class="ms-auto">
        <a class="btn btn-sm btn-outline-secondary" href="/">Back</a>
    </div>
</nav>

<div class="container py-4">
    <h4>Edit Entry</h4>

    <form action="/update/{{ row[0] }}" method="POST" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Website</label>
            <input class="form-control" name="website" value="{{ row[1] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" value="{{ row[2] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input id="editPassword" class="form-control" name="password" value="{{ password }}" required>
                <button type="button" class="btn btn-outline-secondary" id="regenBtn">Regenerate</button>
            </div>
            <div class="form-text">You can type a new password, paste one, or regenerate a strong one.</div>
        </div>

        <button class="btn btn-primary" type="submit">Save changes</button>
        <a class="btn btn-secondary" href="/">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Simple regenerate password call (client-side) — matches server generator roughly
    function generateClientPassword(len=12){
        const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lower = "abcdefghijklmnopqrstuvwxyz";
        const digits = "0123456789";
        const symbols = "!@#$%^&*()-_=+{}[]|:;,.<>?/";
        let pw = [];
        pw.push(upper[Math.floor(Math.random()*upper.length)]);
        pw.push(lower[Math.floor(Math.random()*lower.length)]);
        pw.push(digits[Math.floor(Math.random()*digits.length)]);
        pw.push(symbols[Math.floor(Math.random()*symbols.length)]);
        const all = upper+lower+digits+symbols;
        for(let i=4;i<len;i++) pw.push(all[Math.floor(Math.random()*all.length)]);
        pw = pw.sort(()=>Math.random()-0.5).join("");
        return pw;
    }

    document.getElementById("regenBtn").addEventListener("click", function(){
        document.getElementById("editPassword").value = generateClientPassword(12);
    });
</script>
</body>
</html>
